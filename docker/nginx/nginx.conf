# docker/nginx/nginx.conf
#
# Configuración de Nginx para GymSync V1.
# Funciones: TLS termination, reverse proxy al backend, SPA routing.
# Doc arquitectura: sección 7.3

# Número de workers = número de CPUs
worker_processes auto;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  # ── Tipos MIME ──────────────────────────────────────────────────────────
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Seguridad: no exponer versión de Nginx (RNF-03) ─────────────────────
  server_tokens off;

  # ── Optimización de transferencia ────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;

  # ── Compresión gzip ──────────────────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # ── Logging ───────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Redirigir HTTP → HTTPS (doc arquitectura tabla 7.2) ─────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── Servidor principal HTTPS ──────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    # ── TLS 1.2+ únicamente (RNF-02, doc arquitectura tabla 7.2) ───────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Cabeceras de seguridad (complementa a Helmet del backend) ───────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Tamaño máximo de body ────────────────────────────────────────────────
    client_max_body_size 10M;

    # ── Proxy al backend API ─────────────────────────────────────────────────
    # Las peticiones a /api/* se reenvían al contenedor 'api' en el puerto 3000.
    # 'api' resuelve automáticamente en la red interna de Docker.
    location /api/ {
      proxy_pass         http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;

      # Timeouts
      proxy_connect_timeout 10s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }

    # ── Archivos estáticos del frontend ──────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Cache agresivo para assets con hash (JS, CSS — Vite los hashea en build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # SPA routing — necesario para que React Router funcione en rutas no raíz.
    # Cualquier ruta que no sea un archivo existente sirve index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
